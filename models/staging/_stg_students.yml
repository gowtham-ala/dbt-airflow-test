version: 2

models:
  - name: stg_students
    description: "Cleaned student roster: trimmed text, DD-MM-YYYY strings cast to DATE, admission year derived."
    columns:
      - name: student_id
        description: "10-char student id (prefix 22/23/24)."
        data_tests:
          - not_null
          - unique
          # custom generic test: enforces the id prefix rule
          - valid_student_id_prefix
      - name: student_email
        description: "Lowercased, trimmed institutional email."
        data_tests:
          - not_null
          - unique
      - name: date_of_birth
        description: "Date of birth as a proper DATE (null if the raw string failed to parse)."
        data_tests:
          - not_null
      - name: join_date
        description: "Join date as a proper DATE (null if the raw string failed to parse)."
        data_tests:
          - not_null
      - name: admission_year
        description: "Four-digit year derived from the id prefix."
        data_tests:
          - accepted_values:
              arguments:
                values: [2022, 2023, 2024]
      - name: email_domain
        description: "Domain portion of the email; expected kluniversity.in."
